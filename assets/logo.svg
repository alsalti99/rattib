<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64" role="img" aria-label="Rattib logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B59FF"/>
      <stop offset="1" stop-color="#7A55F5"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".32"/>
      <stop offset=".55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".55" r=".5">
      <stop offset="0" stop-color="#B8A5FF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#6BC8FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="34" r="31" fill="url(#glow)"/>
  <rect x="6" y="6" width="52" height="52" rx="15" fill="url(#bg)"/>
  <rect x="6" y="6" width="52" height="52" rx="15" fill="url(#shine)"/>
  <!-- two deadline threads, crossing: the knot that Rattib untangles -->
  <path d="M16 25c10-10 23 15 32 6" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M16 39c10 10 23-15 32-6" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round"/>
